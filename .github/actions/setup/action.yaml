name: Set up Nix and the build caches
description: >-
  Installs Nix, points it at the CUDA and vision3d binary caches, and restores
  uv's cache of downloaded wheels.

inputs:
  uv-cache:
    description: >-
      Restore and save uv's cache of downloaded wheels.
    default: "false"
  cachix-auth-token:
    description: >-
      Grants push access to the vision3d cache.
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: |
          extra-substituters = https://cache.nixos-cuda.org
          extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

    - name: Set up Cachix
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: vision3d
        authToken: ${{ inputs.cachix-auth-token }}

    - name: Cache uv downloads
      if: inputs.uv-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ hashFiles('uv.lock') }}
        restore-keys: uv-
