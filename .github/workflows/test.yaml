name: test

on:
  workflow_call:
    inputs:
      cache:
        description: "Whether the build should be cached."
        type: boolean
        default: true

permissions: {}

jobs:
  test:
    name: test (${{ matrix.resolution }}, python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: highest
            python-version: "3.14"
          - resolution: lowest-direct
            python-version: "3.12"
    env:
      # `uv sync` and `uv run` re-lock if this differs from the lockfile's
      # strategy (default is `highest`).
      UV_RESOLUTION: ${{ matrix.resolution }}
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ inputs.cache }}
          cache-local-path: ${{ runner.temp }}/uv-cache
      - name: Install project
        run: uv sync --all-extras
      - name: Run CPU tests
        run: uv run pytest -m cpu
