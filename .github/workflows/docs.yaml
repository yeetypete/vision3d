name: docs

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      FORCE_CUDA: "1"
      # The runner has no GPU, so the kernels never run and the gallery only
      # needs the extension to import. One arch keeps the build short.
      TORCH_CUDA_ARCH_LIST: "12.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-local-path: ${{ runner.temp }}/uv-cache
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Cache nuScenes mini
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vision3d/nuscenes-mini
            !~/.cache/vision3d/nuscenes-mini/v1.0-mini.tgz
          key: nuscenes-mini-v1.0-extracted
      - name: Cache KITTI mini
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vision3d/kitti-mini
          key: >-
            kitti-mini-${{ hashFiles('gallery/datasets/plot_kitti.py',
            'src/vision3d/datasets/kitti.py') }}
      - name: Build docs
        run: uv run make -C docs html
      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: docs/build/html
          if-no-files-found: error
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-html
          path: html
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy html --project-name=vision3d --branch=main
