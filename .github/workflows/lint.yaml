name: lint

on:
  workflow_call:
    inputs:
      cache:
        description: "Whether the build should be cached."
        type: boolean
        default: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
        with:
          enable-cache: ${{ inputs.cache }}
          cache-local-path: ${{ runner.temp }}/uv-cache
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups --no-install-project
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Pyrefly typecheck
        run: uv run pyrefly check

  clang-tidy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # The runner has no GPU, so torch would otherwise build every arch it
      # supports.
      TORCH_CUDA_ARCH_LIST: "12.0"
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy-22 ninja-build
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
        with:
          enable-cache: ${{ inputs.cache }}
          cache-local-path: ${{ runner.temp }}/uv-cache
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups --no-install-project
      - name: clang-tidy
        run: make tidy
