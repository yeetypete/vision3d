name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run pre-commit hooks
        uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2

  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yaml

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  required-checks-passed:
    name: all required checks passed
    if: always()
    needs:
      - pre-commit
      - lint
      - test
      - build
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
