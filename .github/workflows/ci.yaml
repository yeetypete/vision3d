name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pre-commit hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yaml

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml

  test-gpu:
    # PRs from forks do not receive Modal secrets.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: read
    uses: ./.github/workflows/test-gpu.yaml
    secrets:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  docs:
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/docs.yaml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  required-checks-passed:
    if: always()
    needs:
      - build
      - docs
      - lint
      - pre-commit
      - test
      - test-gpu
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
