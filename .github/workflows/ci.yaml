name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          uv-cache: true
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check flake
        run: nix flake check --all-systems
      - name: Sync environment
        run: just sync
      - name: Run git hooks
        run: nix fmt
      - name: Show fixer changes
        if: failure()
        run: git diff
      - name: Type check and clang-tidy
        run: just lint

  # TODO: Enable GPU tests once we have a GPU runner.
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - torch211-cu128
          - torch212-cu130
          - torch213-cu132
    defaults:
      run:
        shell: nix develop .#${{ matrix.variant }} -c bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          uv-cache: true
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run CPU tests
        run: just test -m cpu

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#wheel -c bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          uv-cache: true
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Already in the shell `just wheel` enters, so call the inner recipe.
      - name: Build wheel
        run: just _wheel
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          if-no-files-found: error
          retention-days: 5
          path: dist

  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          uv-cache: true
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Cache nuScenes mini
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vision3d/nuscenes-mini
            !~/.cache/vision3d/nuscenes-mini/v1.0-mini.tgz
          key: nuscenes-mini-v1.0-extracted
      - name: Cache KITTI mini
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vision3d/kitti-mini
          key: >-
            kitti-mini-${{ hashFiles('gallery/datasets/plot_kitti.py',
            'src/vision3d/datasets/kitti.py') }}
      - name: Sync environment
        run: just sync
      - name: Build docs
        run: just docs html
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: docs/build/html
          if-no-files-found: error
          retention-days: 5

  deploy-docs:
    name: Deploy docs
    needs: docs
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-html
          path: html
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy html --project-name=vision3d --branch=main
