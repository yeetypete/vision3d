name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every output has to evaluate for both systems, which a runner can do
  # without being able to build for either.
  eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # `nix flake check --all-systems --no-build` is the obvious command, but
      # it evaluates in read-only mode, which cannot realise the nixpkgs the
      # manylinux toolchain imports mid-evaluation. See NixOS/nix#4265. Forcing
      # each `drvPath` reaches the same outputs on every system and builds none
      # of them.
      - name: Evaluate every output
        run: |
          for output in checks devShells formatter packages; do
            nix eval --json ".#$output" --apply '
              builtins.mapAttrs (
                _: v: if v ? drvPath then v.drvPath else builtins.mapAttrs (_: d: d.drvPath) v
              )
            ' > /dev/null
          done

  # TODO: Enable GPU tests once we have a GPU runner.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - tests-torch210-cu128
          - tests-torch211-cu130
          - tests-torch212-cu130
          - tests-torch213-cu130
          - pyrefly
          - clang-tidy
          - pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run check
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.${{ matrix.check }}'

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the release artifacts
        run: echo "dist=$(nix build --no-link --print-out-paths '.#dist')" >> "$GITHUB_ENV"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          if-no-files-found: error
          retention-days: 5
          path: ${{ env.dist }}/*

  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Cache nuScenes mini
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vision3d/nuscenes-mini
            !~/.cache/vision3d/nuscenes-mini/v1.0-mini.tgz
          key: nuscenes-mini-v1.0-extracted
      - name: Cache KITTI mini
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vision3d/kitti-mini
          key: >-
            kitti-mini-${{ hashFiles('gallery/datasets/plot_kitti.py',
            'src/vision3d/datasets/kitti.py') }}
      - name: Build docs
        run: just docs html
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: docs/build/html
          if-no-files-found: error
          retention-days: 5

  deploy-docs:
    name: Deploy docs
    needs: docs
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-html
          path: html
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy html --project-name=vision3d --branch=main
