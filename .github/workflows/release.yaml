name: release
run-name: release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1). Must match pyproject.toml."
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Verify version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(uv version --short)"
          if [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::Input version (${INPUT_VERSION}) does not match the project version (${version}). Bump \`project.version\` in pyproject.toml on main first."
            exit 1
          fi

  ci:
    needs: verify
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  announce:
    name: Create GitHub release
    needs: ci
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ inputs.version }}"
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes \
            dist/*

  publish-pypi:
    name: Publish release to PyPI
    needs: announce
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish
        run: uv publish
