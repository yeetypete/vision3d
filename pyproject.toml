[project]
name = "vision3d"
version = "0.5.1"
description = "A 3D extension of torchvision."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Peter Siegel" }]
dependencies = [
  "numpy",
  "pillow>=11.3",
  "torch>=2.10",
  "torchvision>=0.25",
  "typing-extensions>=4.13; python_version < '3.13'",
]

[project.urls]
Homepage = "https://github.com/yeetypete/vision3d"
Issues = "https://github.com/yeetypete/vision3d/issues"
Repository = "https://github.com/yeetypete/vision3d"

[project.optional-dependencies]
viz = [
  "rerun-sdk>=0.31.1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.152.7",
  "nuscenes-devkit>=1.2.0",
  # nvidia-cuda-cccl is used only by `make tidy`. The CCCL CUDA toolkit bundles
  # annotates the <cuda/std/string_view> deduction guides __host__-only, which
  # clang rejects. clang-tidy needs CCCL 3.4 or newer which contains the fix.
  # See: https://github.com/NVIDIA/cccl/issues/7896.
  "nvidia-cuda-cccl==13.3.4.1.2rc1",
  "pyrefly>=1.1.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.9",
  "types-docutils>=0.21",
  "types-setuptools>=80",
]
# One group per (toolkit, torch) pair in `nix/cuda.nix`. Each dev shell leaves
# the group matching the toolkit it provides enabled and disables the rest, so
# torch is always built against the toolkit that builds the extension.
# `tool.uv.conflicts` keeps all of them in one lockfile.
torch211-cu128 = ["torch==2.11.*", "torchvision==0.26.*"]
torch212-cu130 = ["torch==2.12.*", "torchvision==0.27.*"]
torch213-cu132 = ["torch==2.13.*", "torchvision==0.28.*"]
docs = [
  "myst-parser>=5.1.0",
  "pydata-sphinx-theme>=0.17.0",
  "sphinx>=9.1.0",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-gallery>=0.21.0",
]

[build-system]
requires = ["numpy>=2", "setuptools>=77", "torch>=2.10"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["vision3d"]
branch = true

[tool.pyrefly]
preset = "strict"
min-severity = "ignore"
search-path = ["test", "gallery", "docs/source/_ext"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --strict-markers"
filterwarnings = [
  "error",
  # Unrelated warning from `@torch.jit.script_method` in torch/utils/mkldnn.py.
  "ignore:.*torch\\.jit\\.script_method.*:DeprecationWarning",
  # `torch.compile`'s inductor backend warns on every CUDA compile that TF32
  # matmuls are available but disabled. Enabling them would trade the
  # precision the tests assert on for speed we do not need.
  "ignore:TensorFloat32 tensor cores.*:UserWarning",
]

[tool.ruff.lint]
preview = true
extend-select = ["D", "DOC", "PT", "TC"]
ignore = [
  "D107",  # constructor args documented in the class docstring, not __init__
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["D"]
"gallery/**" = ["D", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.uv]
# Only one torch variant can be installed at a time. Declaring them conflicting
# makes uv resolve each into the same lockfile, so `uv sync --locked --group
# <variant>` needs no relocking.
conflicts = [
  [
    { group = "torch211-cu128" },
    { group = "torch212-cu130" },
    { group = "torch213-cu132" },
  ],
]
# Every variant is a default, and each dev shell disables ones it does not provide
# through `UV_NO_GROUP`.
default-groups = [
  "dev",
  "docs",
  "torch211-cu128",
  "torch212-cu130",
  "torch213-cu132",
]
# The PyTorch wheel index (download.pytorch.org/whl/cuXXX) mirrors a stale
# subset of PyPI. Use `unsafe-first-match` so the resolver exhausts the
# user-supplied `--index <pytorch>` first (keeping torch on the requested
# CUDA variant) and only falls through to PyPI for build dependencies that
# no version on the PyTorch mirror can satisfy.
index-strategy = "unsafe-first-match"
# Fix `nuscenes-devkit`'s stale pins: `Shapely~=2.0.3` has no Python 3.14
# wheels, and `numpy<2.0.0` conflicts with our `numpy>=2`.
override-dependencies = [
  "shapely>=2.1",
  "numpy>=2",
]
# uv keys its build cache on `pyproject.toml`/`setup.py` alone by default.
# Listing the native sources and the environment variables `setup.py` reads
# makes `uv sync` rebuild on its own. Naming any key replaces the defaults,
# so the two default files are repeated here.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "src/vision3d/ops/csrc/**" },
  { env = "FORCE_CUDA" },
  { env = "TORCH_CUDA_ARCH_LIST" },
  { env = "UV_NO_GROUP" },
]

# `[build-system] requires` is resolved in an isolated environment that reads
# neither `uv.lock` nor the groups above, so `torch>=2.10` would resolve to the
# one build PyPI publishes, whose CUDA major nvcc then rejects. `match-runtime`
# pins the build to the torch the environment resolved instead.
[tool.uv.extra-build-dependencies]
vision3d = [{ requirement = "torch", match-runtime = true }]

# Bind each variant group to the PyTorch wheel index carrying that CUDA build.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", group = "torch211-cu128" },
  { index = "pytorch-cu130", group = "torch212-cu130" },
  { index = "pytorch-cu132", group = "torch213-cu132" },
]
torchvision = [
  { index = "pytorch-cu128", group = "torch211-cu128" },
  { index = "pytorch-cu130", group = "torch212-cu130" },
  { index = "pytorch-cu132", group = "torch213-cu132" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
