[project]
name = "vision3d"
version = "0.5.2"
description = "A 3D extension of torchvision."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Peter Siegel" }]
dependencies = [
  "numpy>=2",
  "pillow>=11.3",
  "torch>=2.11",
  "torchcodec>=0.16",
  "torchvision>=0.26",
  "typing-extensions>=4.11; python_version < '3.13'",
]

[project.urls]
Homepage = "https://github.com/yeetypete/vision3d"
Issues = "https://github.com/yeetypete/vision3d/issues"
Repository = "https://github.com/yeetypete/vision3d"

[project.optional-dependencies]
viz = [
  "rerun-sdk>=0.31.1",
]

[dependency-groups]
dev = [
  # cuda-toolkit and nvidia-cuda-cccl are used only by `make tidy`, which builds
  # in the project environment. cuda-toolkit provides nvcc. The CCCL the CUDA
  # toolkit bundles annotates the <cuda/std/string_view> deduction guides
  # __host__-only, which clang rejects. clang-tidy needs CCCL 3.4 or newer which
  # contains the fix. See: https://github.com/NVIDIA/cccl/issues/7896.
  "cuda-toolkit[nvcc]>=13",
  "hypothesis>=6.152.7",
  "nuscenes-devkit>=1.2.0",
  "nvidia-cuda-cccl==13.3.4.3.1",
  "pyrefly>=1.4.0",
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "types-docutils>=0.21",
  "types-setuptools>=80",
]
docs = [
  "myst-parser>=5.1.0",
  "pydata-sphinx-theme>=0.17.0",
  "sphinx>=9.1.0",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-gallery>=0.22.0",
]
modal = [
  "modal>=1.6.2",
]

[build-system]
requires = ["ninja", "numpy>=2", "setuptools>=77", "torch>=2.11"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["vision3d"]
branch = true

[tool.pyrefly]
preset = "strict"
min-severity = "ignore"
search-path = ["test", "gallery", "docs/source/_ext"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --strict-markers"
filterwarnings = [
  "error",
  # Unrelated warning from `@torch.jit.script_method` in torch/utils/mkldnn.py.
  "ignore:.*torch\\.jit\\.script_method.*:DeprecationWarning",
  # Inductor warns on every CUDA compile that TF32 matmuls are disabled.
  # Enabling them would cost the precision the tests assert on.
  "ignore:TensorFloat32 tensor cores.*:UserWarning",
]

[tool.ruff.lint]
preview = true
extend-select = ["D", "DOC", "PT", "TC"]
ignore = [
  "D107",  # constructor args documented in the class docstring, not __init__
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["D"]
"gallery/**" = ["D", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.uv]
# Older versions rewrite uv.lock with a lower lockfile revision.
required-version = ">=0.12.22"
# The PyTorch wheel index (download.pytorch.org/whl/cuXXX) mirrors a stale
# subset of PyPI. Use `unsafe-first-match` so the resolver exhausts the
# user-supplied `--index <pytorch>` first (keeping torch on the requested
# CUDA variant) and only falls through to PyPI for build dependencies that
# no version on the PyTorch mirror can satisfy.
index-strategy = "unsafe-first-match"
# torch.compile requires Python development headers.
python-preference = "only-managed"
# Fix `nuscenes-devkit`'s stale pins: `Shapely~=2.0.3` has no Python 3.14
# wheels, and `numpy<2.0.0` conflicts with our `numpy>=2`.
override-dependencies = [
  "shapely>=2.1",
  "numpy>=2",
]

cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "src/vision3d/ops/csrc/**" },
  { env = "CUDA_HOME" },
  { env = "CUDA_PATH" },
  { env = "FORCE_CUDA" },
  { env = "TORCH_CUDA_ARCH_LIST" },
]

# Build against nvcc from the `cuda-toolkit` wheels. Only uv reads this,
# so other installers still need a system-wide CUDA toolkit installation.
[tool.uv.extra-build-dependencies]
vision3d = ["cuda-toolkit[nvcc,cccl]"]
